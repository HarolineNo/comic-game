<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete,redo,undo,square,rectangle,circle,diagonal_line,colors" />
    <link rel="stylesheet" type="text/css" href="css/styles.css" th:href="@{/css/styles.css}"/>
    <title>Drawing Canvas</title>
</head>
<body>
    <div id="painting-canvas" style="display: flex;">
        <div class="tool-set">
            <button type="button" class="color-option red" onClick="changeColor('red')"></button>
            <button type="button" class="color-option pink" onClick="changeColor('hotpink')"></button>
            <button type="button" class="color-option orange" onClick="changeColor('darkorange')"></button>
            <button type="button" class="color-option yellow" onClick="changeColor('yellow')"></button>
            <button type="button" class="color-option green" onClick="changeColor('green')"></button>
            <button type="button" class="color-option blue" onClick="changeColor('blue')"></button>
            <button type="button" class="color-option purple" onClick="changeColor('purple')"></button>
            <button type="button" class="color-option brown" onClick="changeColor('saddlebrown')"></button>
            <button type="button" class="color-option gray" onClick="changeColor('gray')"></button>
            <button type="button" class="color-option black" onClick="changeColor('black')"></button>
            <button type="button" class="color-option white" onClick="changeColor('white')"></button>
            <button type="button" class="clear-canvas" onClick="clearCanvas()">
                <span class="material-symbols-outlined">delete</span>
            </button>
            <button type="button" id="undo">
                <span class="material-symbols-outlined">undo</span>
            </button>
            <button type="button" id="redo">
                <span class="material-symbols-outlined">redo</span>
            </button>
            <button type="button" id="fill-bucket">
                <span class="material-symbols-outlined">colors</span>
            </button>
            <div class="shapes-set">
                <button type="button" id="rectangle">
                    <span class="material-symbols-outlined">rectangle</span>
                </button>
                <button type="button" id="square">
                    <span class="material-symbols-outlined">square</span>
                </button>
                <button type="button" id="circle">
                    <span class="material-symbols-outlined">circle</span>
                </button>
                <button type="button" id="line-segment">
                    <span class="material-symbols-outlined">diagonal_line</span>
                </button>
            </div>
        </div>
        <canvas id="canvas" width="500px" height="300px"></canvas>
    </div>
    <div class="brush-size">
        <label>
            <input type="range" min="1" max="50" value="5" id="slider">
        </label>
    </div>

    <script>
        const c = document.getElementById("canvas");
        const slider = document.getElementById("slider");
        const ctx = c.getContext("2d");
        let x = 0;
        let y = 0;
        let isDrawing = false;
        let brushSize = 5;

        // Function to draw a line based on user's mouse position
        function drawLine(x1, y1, x2, y2) {
            ctx.beginPath();
            // Starts line at the position where the user first begins to hold down their mouse
            ctx.moveTo(x1, y1);
            // Determines the path of the line depending on the coordinates when the mouse moves
            ctx.lineTo(x2, y2);
            ctx.lineWidth = brushSize;
            // Determines the shape of the line (the shape of the end caps)
            ctx.lineCap = 'round';
            // Creates a rounded corner when two lines meet
            ctx.lineJoin = 'round';
            // Renders the line
            ctx.stroke();
        }

        // When the user presses down on their mouse, isDrawing is set to true and the line's beginning is offest to match the user's position
        c.addEventListener('mousedown', (e) => {
            x = e.offsetX;
            y = e.offsetY;
            isDrawing = true;
        })

        // The x and y positions are offset to match the mouse's position to draw a continuous line
        c.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                drawLine(x, y, e.offsetX, e.offsetY);
                x = e.offsetX;
                y = e.offsetY;
            }
        })

        // When the user stop holding their mouse down, isDrawing is set to false, the line ends at the user's last position, and the coordinates are reset back to 0,0
        window.addEventListener('mouseup', (e) => {
            if (isDrawing) {
                drawLine(x, y, e.offsetX, e.offsetY);
                x = 0;
                y = 0;
                isDrawing = false;
            }
        })

        // When user clicks a color, the color of the brush changes to that color
        function changeColor(color) {
            ctx.strokeStyle = color;
        }

        // When user clicks the clear button, a filled white rectangle is filled starting from the top left, matching the canvas's proportions
        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, c.width, c.height)
        }

        // Changes the size of the brush based ont the value of the input slider
        slider.addEventListener('change', (e) => {
            brushSize = e.target.value;
            ctx.lineWidth = brushSize;
        })


    </script>
</body>
</html>
